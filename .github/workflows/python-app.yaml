name: Python application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      checks: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/vote

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        id: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/vote
        run: |
          test_results="${PWD}/test-results.xml"
          pytest --junit-xml "${test_results}"

          # Generate Output
          echo "report_paths=${test_results}" | tee -a $GITHUB_OUTPUT

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a83fd2b5d58d4fc702e690c1ea688d702d28d281 # v5.6.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: ${{ steps.pytest.outputs.report_paths }}
          detailed_summary: true
          include_passed: true

      - name: Generate Coverage
        id: coverage
        run: |
          pytest --cov --cov-report=xml

          # Expose Coverage path
          path=$(realpath --relative-to=${{ github.workspace }} coverage.xml)
          echo "path=${path}" | tee -a $GITHUB_OUTPUT
        env:
          PYTHONPATH: ${{ github.workspace }}/vote

      - name: Publish Coverage
        uses: 5monkeys/cobertura-action@ee5787cc56634acddedc51f21c7947985531e6eb # v14.0.0
        with:
          path: ${{ steps.coverage.outputs.path }}
          minimum_coverage: 70
          fail_below_threshold: true
          show_line: true
          show_branch: true

      - name: Check Dirty Repository
        run: |
          if ! git diff-index --quiet HEAD; then
            echo "::error::Dirty repository found"
            git status --porcelain
            exit 1
          fi
